<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMACUU — Evidencia por sección</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1B33;
    --paper:#EEF1F8;
    --card:#FFFFFF;
    --brand:#1D3FA0;
    --brand-deep:#132B72;
    --green:#1F8F5F;
    --green-bg:#E6F4ED;
    --line:#E1E5F0;
    --muted:#616B87;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--paper);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    padding-bottom:40px;
  }
  .hidden{display:none!important}
  .center-msg{text-align:center;padding:4rem 1.5rem;color:var(--muted);font-size:16px}
  .center-msg .ico{font-size:48px;margin-bottom:12px}
  .page{max-width:640px;margin:0 auto;}

  .hero{
    background:linear-gradient(160deg, var(--brand) 0%, var(--brand-deep) 100%);
    color:#fff;padding:26px 20px 30px;text-align:center;
  }
  .hero-brand{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;opacity:.92;margin-bottom:4px;}
  .hero-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;line-height:1.2;}
  .hero-date{font-size:12.5px;color:#B8C4E8;font-weight:500;margin-top:4px;}

  .body{padding:18px 16px 40px;}

  .estado-banner{border-radius:16px;padding:16px;text-align:center;font-weight:800;font-size:15px;margin-bottom:14px;}
  .estado-banner.ok{background:var(--green-bg);color:var(--green);border:1.5px solid #B9E2CD;}
  .estado-banner.pendiente{background:#EEF0F6;color:var(--muted);border:1.5px solid var(--line);font-weight:700;font-size:13.5px;}
  .estado-banner .sub{font-size:11.5px;font-weight:600;margin-top:6px;opacity:.85;}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;margin-bottom:14px;}
  .datos-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .dato-label{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-bottom:2px;}
  .dato-valor{font-size:14px;font-weight:700;}
  @media(max-width:420px){ .datos-grid{grid-template-columns:1fr} }

  .panel-head-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .panel-head-row h2{font-family:'Space Grotesk',sans-serif;font-size:15.5px;font-weight:600;color:var(--ink);}
  .btn-download-all{border:none;background:var(--brand);color:#fff;font-size:11.5px;font-weight:700;padding:8px 12px;border-radius:9px;cursor:pointer;}
  .btn-download-all:disabled{opacity:.6;cursor:not-allowed;}

  .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .photo-thumb{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:1px solid var(--line);}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-dl{position:absolute;bottom:6px;right:6px;width:26px;height:26px;border-radius:8px;border:none;background:rgba(15,27,51,0.72);color:#fff;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;}
  @media (min-width:480px){ .photo-grid{grid-template-columns:repeat(4,1fr);} }

  .footer{text-align:center;font-size:11px;color:var(--muted);margin-top:16px;}
</style>
</head>
<body>

<div id="loading" class="center-msg">
  <div class="ico">⏳</div>
  Cargando…
</div>

<div id="error-box" class="page hidden" style="padding:24px">
  <div class="panel center-msg">
    <div class="ico">⚠️</div>
    <div id="error-msg"></div>
  </div>
</div>

<div id="contenido" class="hidden">
<div class="page">

  <div class="hero">
    <div class="hero-brand">🧹 GEMACUU</div>
    <div class="hero-title" id="d-evento"></div>
    <div class="hero-date" id="d-fecha"></div>
  </div>

  <div class="body">
    <div id="estado-banner" class="estado-banner"></div>

    <div class="panel">
      <div class="datos-grid">
        <div><div class="dato-label">Sección</div><div class="dato-valor" id="d-seccion"></div></div>
        <div><div class="dato-label">Líder responsable</div><div class="dato-valor" id="d-lider"></div></div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head-row">
        <h2 id="fotos-titulo">📸 Fotos</h2>
        <button class="btn-download-all" id="btn-descargar-todas" onclick="descargarTodasFotos(this)" hidden>⬇ Descargar todas</button>
      </div>
      <div id="fotos-cont"></div>
    </div>
  </div>

  <div class="footer">Documento generado por GEMACUU</div>
</div>
</div>

<script>
const SB_URL='https://hhqauklluvlfqbweipxa.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhocWF1a2xsdXZsZnFid2VpcHhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyMDg2MjQsImV4cCI6MjA5MTc4NDYyNH0.Y5S2UsRm_hfT7QUuYXJzGVFy-IICJO172iXu8tRieks';

let fotosSeccion=[];

async function sbGet(table,params=''){
  const r=await fetch(`${SB_URL}/rest/v1/${table}${params}`,{headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

function mostrarError(msg){
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error-msg').textContent=msg;
  document.getElementById('error-box').classList.remove('hidden');
}

// Inserta fl_attachment justo después de /upload/ para que Cloudinary fuerce
// la descarga real del archivo en vez de solo abrir la imagen en el navegador.
function urlDescarga(cloudinaryUrl){
  return cloudinaryUrl.replace('/upload/','/upload/fl_attachment/');
}

async function init(){
  const params=new URLSearchParams(location.search);
  const eventoId=params.get('evento');
  const seccion=params.get('seccion');
  if(!eventoId||!seccion){ mostrarError('Este enlace no incluye evento o sección válidos.'); return; }

  let evento,fotos,asisRows,liderRows;
  try{
    const eventoRows=await sbGet('eventos',`?id=eq.${encodeURIComponent(eventoId)}`);
    evento=Array.isArray(eventoRows)?eventoRows[0]:null;
    if(!evento){ mostrarError('No se encontró el evento indicado en este enlace.'); return; }
    if(evento.evidencia_publica===false){ mostrarError('Esta evidencia ya no está disponible públicamente.'); return; }

    // Personal cuya sección real es esta, para cruzar con asistencia_eventos
    const personalRows=await sbGet('personal',`?seccion=eq.${encodeURIComponent(seccion)}&select=id`);
    const idsPropios=(Array.isArray(personalRows)?personalRows:[]).map(p=>p.id);

    // Líder en vivo: quien tiene es_lider_seccion=true y sigue activo en esta sección.
    liderRows=await sbGet('personal',`?seccion=eq.${encodeURIComponent(seccion)}&es_lider_seccion=eq.true&status=eq.activo&select=nombre&order=nombre.asc&limit=1`);

    // "Capturado" = existe asistencia guardada para esta sección en este evento,
    // ya sea de su gente propia o de alguien marcado aquí desde otra sección.
    const condiciones=[`capturado_en_seccion.eq.${encodeURIComponent(seccion)}`];
    if(idsPropios.length) condiciones.push(`personal_id.in.(${idsPropios.join(',')})`);
    const asisData=await sbGet('asistencia_eventos',`?evento_id=eq.${encodeURIComponent(eventoId)}&or=(${condiciones.join(',')})&select=updated_at`);
    asisRows=Array.isArray(asisData)?asisData:[];

    // Solo las fotos de ESTA sección — nunca las de otras secciones del mismo evento.
    const fotosData=await sbGet('fotos_actividad_seccion',`?evento_id=eq.${encodeURIComponent(eventoId)}&seccion=eq.${encodeURIComponent(seccion)}&order=creado_en.asc`);
    fotos=Array.isArray(fotosData)?fotosData:[];
  }catch(e){
    console.error(e);
    mostrarError('No se pudo cargar la evidencia de esta sección. Intenta de nuevo más tarde.');
    return;
  }

  fotosSeccion=fotos;

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('contenido').classList.remove('hidden');
  document.getElementById('d-evento').textContent=evento.nombre||'—';
  document.getElementById('d-fecha').textContent=evento.fecha||'—';

  const banner=document.getElementById('estado-banner');
  if(asisRows.length){
    const ultima=asisRows.reduce((max,a)=>new Date(a.updated_at)>new Date(max.updated_at)?a:max,asisRows[0]);
    const fechaHora=new Date(ultima.updated_at).toLocaleString('es-MX',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
    banner.className='estado-banner ok';
    banner.innerHTML=`✔ CAPTURADO<div class="sub">Asistencia guardada el ${fechaHora}</div>`;
  } else {
    banner.className='estado-banner pendiente';
    banner.textContent='⏳ Aún sin asistencia registrada para esta sección en este evento';
  }

  document.getElementById('d-seccion').textContent=seccion;
  document.getElementById('d-lider').textContent=(Array.isArray(liderRows)&&liderRows[0]?.nombre)||'— sin líder activo —';

  document.getElementById('fotos-titulo').textContent=`📸 Fotos (${fotos.length})`;
  document.getElementById('btn-descargar-todas').hidden=fotos.length===0;
  const fotosCont=document.getElementById('fotos-cont');
  fotosCont.innerHTML=fotos.length
    ? `<div class="photo-grid">${fotos.map((f,i)=>`
        <div class="photo-thumb">
          <img src="${f.cloudinary_url}" loading="lazy" alt="Evidencia sección ${seccion} ${i+1}">
          <a class="photo-dl" href="${urlDescarga(f.cloudinary_url)}" download title="Descargar esta foto">⬇</a>
        </div>`).join('')}</div>`
    : '<div style="text-align:center;color:var(--muted);font-size:13px;padding:1rem 0">Sin evidencia fotográfica todavía.</div>';
}

// Dispara la descarga de cada foto una por una (con un pequeño intervalo entre cada una, para
// que el navegador no las bloquee por venir "todas de golpe"). Mismo mecanismo que ya usa
// evidencia-evento.html para descargar todas las fotos de una sección.
function descargarTodasFotos(btn){
  if(!fotosSeccion.length) return;
  btn.disabled=true;
  const textoOriginal=btn.textContent;
  let i=0;
  const disparar=()=>{
    if(i>=fotosSeccion.length){ btn.disabled=false; btn.textContent=textoOriginal; return; }
    const a=document.createElement('a');
    a.href=urlDescarga(fotosSeccion[i].cloudinary_url);
    a.download='';
    document.body.appendChild(a);
    a.click();
    a.remove();
    i++;
    setTimeout(disparar,400);
  };
  btn.textContent='Descargando…';
  disparar();
}

init();
</script>
</body>
</html>
