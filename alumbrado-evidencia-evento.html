<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>GEMACUU · Alumbrado — Evidencia por evento</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pan:#003399;--pan2:#1a4fc4;--red:#cc0000;--green:#2d6a4f;--amber:#854f0b;
  --bg:#f0f4ff;--text:#1a1a2e;--muted:#6b7280;
  --border:#d1d9f0;--shadow:0 2px 12px rgba(0,51,153,.08);
  --radius:16px;--radius-sm:9px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px}
.hidden{display:none!important}
.center-msg{text-align:center;padding:4rem 1.5rem;color:var(--muted);font-size:16px}
.center-msg .ico{font-size:48px;margin-bottom:12px}

.banner{background:linear-gradient(135deg,var(--pan) 0%,var(--pan2) 100%);color:#fff;padding:32px 24px;text-align:center;box-shadow:0 4px 16px rgba(0,0,102,.25)}
.banner-logo{font-size:14px;font-weight:700;letter-spacing:.12em;opacity:.75;margin-bottom:10px}
.banner-nombre{font-size:clamp(22px,4vw,36px);font-weight:800;line-height:1.2}
.banner-fecha{font-size:16px;opacity:.85;margin-top:8px;font-weight:600}

.wrap{max-width:1100px;margin:0 auto;padding:24px}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px 16px;text-align:center;box-shadow:var(--shadow)}
.stat-num{font-size:clamp(30px,4vw,42px);font-weight:800;line-height:1}
.stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-top:6px}

.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:1.4rem;box-shadow:var(--shadow);margin-bottom:24px}
.card-title{font-size:17px;font-weight:800;color:var(--pan);margin-bottom:14px;display:flex;align-items:center;gap:8px}

.top3-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.top3-item{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--radius-sm);border:1px solid #fac775;background:linear-gradient(135deg,#fffbea 0%,#fff 100%)}
.top3-medalla{font-size:34px;line-height:1;flex-shrink:0}
.top3-info{flex:1;min-width:0}
.top3-seccion{font-size:15px;font-weight:800;color:var(--pan)}
.top3-lider{font-size:12px;font-weight:600;color:var(--text)}
.top3-oficina{font-size:11px;color:var(--muted)}
.top3-num{font-size:28px;font-weight:800;color:var(--amber);text-align:right;flex-shrink:0}

.faltaron-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.faltaron-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:#fce8e8;border:1px solid #f5c2c2;border-radius:var(--radius-sm)}
.faltaron-nombre{font-size:13px;font-weight:700;color:var(--red)}
.faltaron-acum{font-size:11px;font-weight:700;color:#fff;background:var(--red);padding:2px 9px;border-radius:20px;white-space:nowrap}
.vacio{text-align:center;color:var(--muted);font-size:14px;padding:1.2rem 0}

.seccion-item{border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;overflow:hidden}
.seccion-hdr{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;background:#fff;flex-wrap:wrap}
.seccion-hdr:hover{background:#f8faff}
.seccion-hdr-num{font-size:16px;font-weight:800;color:var(--pan);min-width:64px}
.seccion-hdr-lider{flex:1;min-width:140px}
.seccion-hdr-lider .nombre{font-size:13px;font-weight:700}
.seccion-hdr-lider .oficina{font-size:11px;color:var(--muted)}
.seccion-hdr-metric{text-align:center;min-width:78px}
.seccion-hdr-metric .n{font-size:18px;font-weight:800;color:var(--pan)}
.seccion-hdr-metric .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.seccion-arrow{font-size:14px;color:var(--muted);transition:transform .15s;flex-shrink:0}
.seccion-item.open .seccion-arrow{transform:rotate(180deg)}
.seccion-detail{display:none;padding:16px;border-top:1px solid var(--border);background:#f8faff}
.seccion-item.open .seccion-detail{display:block}
.seccion-detail-title{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.asis-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin-bottom:16px}
.asis-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 11px;background:#fff;border:1px solid var(--border);border-radius:7px;font-size:12.5px}
.asis-estado{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.e-ASISTENCIA{background:#eaf3de;color:var(--green)}
.e-FALTA{background:#fce8e8;color:var(--red)}
.e-VACACIONES{background:#e6eeff;color:var(--pan)}
.e-INCAPACIDAD{background:#fef3c7;color:var(--amber)}
.e-SIN{background:#f0f0f0;color:var(--muted)}

.fotos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.foto-item img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--radius-sm);border:1px solid var(--border);display:block;margin-bottom:8px;background:var(--bg)}
.btn-descarga{display:block;width:100%;text-align:center;padding:8px;background:var(--pan);color:#fff;border-radius:var(--radius-sm);font-size:12px;font-weight:700;text-decoration:none}

.footer{text-align:center;font-size:11px;color:var(--muted);margin-top:16px}
</style>
</head>
<body>

<div id="loading" class="center-msg">
  <div class="ico">⏳</div>
  Cargando…
</div>

<div id="error-box" class="wrap hidden">
  <div class="card center-msg">
    <div class="ico">⚠️</div>
    <div id="error-msg"></div>
  </div>
</div>

<div id="revocado-box" class="wrap hidden">
  <div class="card center-msg">
    <div class="ico">🔒</div>
    <div>Esta evidencia ya no está disponible públicamente.</div>
  </div>
</div>

<div id="contenido" class="hidden">

  <div class="banner">
    <div class="banner-logo">💡 GEMACUU · Alumbrado</div>
    <div class="banner-nombre" id="d-evento"></div>
    <div class="banner-fecha" id="d-fecha"></div>
  </div>

  <div class="wrap">

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num" id="st-asistencia" style="color:var(--green)">0</div><div class="stat-label">Asistencia</div></div>
      <div class="stat-card"><div class="stat-num" id="st-falta" style="color:var(--red)">0</div><div class="stat-label">Falta</div></div>
      <div class="stat-card"><div class="stat-num" id="st-vacaciones" style="color:var(--pan)">0</div><div class="stat-label">Vacaciones</div></div>
      <div class="stat-card"><div class="stat-num" id="st-incapacidad" style="color:var(--amber)">0</div><div class="stat-label">Incapacidad</div></div>
      <div class="stat-card"><div class="stat-num" id="st-total" style="color:var(--text)">0</div><div class="stat-label">Total personal</div></div>
      <div class="stat-card"><div class="stat-num" id="st-encuestas" style="color:var(--pan2)">0</div><div class="stat-label">Encuestas totales</div></div>
    </div>

    <div class="card">
      <div class="card-title">🏆 Top 3 secciones — Encuestas/puertas</div>
      <div id="top3-cont"></div>
    </div>

    <div class="card">
      <div class="card-title">❌ Faltaron (<span id="faltaron-count">0</span>)</div>
      <div id="faltaron-cont"></div>
    </div>

    <div class="card">
      <div class="card-title">📍 Secciones</div>
      <div id="secciones-cont"></div>
    </div>

  </div>

  <div class="footer">Documento generado por GEMACUU · Alumbrado</div>
</div>

<script>
const SB_URL='https://hhqauklluvlfqbweipxa.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhocWF1a2xsdXZsZnFid2VpcHhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYyMDg2MjQsImV4cCI6MjA5MTc4NDYyNH0.Y5S2UsRm_hfT7QUuYXJzGVFy-IICJO172iXu8tRieks';
const ESTADOS=['ASISTENCIA','FALTA','VACACIONES','INCAPACIDAD'];
const ESTADO_LABEL={ASISTENCIA:'Asistencia',FALTA:'Falta',VACACIONES:'Vacaciones',INCAPACIDAD:'Incapacidad'};
const OFICINA_LABEL={'60':'Oficinas Centrales','30':'Centro de Acopio'};

let evento=null;
let personalCache=[];
let asisMap={};
let estadoPorSeccion={};
let faltasAcumuladas={};
let fotosPorSeccion={};
let encuestasPorSeccion={};
let liderPorSeccion={};
let seccionesCatalogo=[]; // números de sección en vivo (no hay catálogo fijo en Alumbrado)
const seccionesExpandidas=new Set();

function nombreCompleto(p){
  return [p.nombre,p.apellido_paterno,p.apellido_materno].filter(Boolean).join(' ');
}
function liderDe(seccionNum){
  return liderPorSeccion[seccionNum]||'— sin líder activo —';
}
function oficinaDe(seccionNum){
  const p=personalCache.find(x=>x.seccion===seccionNum);
  return p?OFICINA_LABEL[String(p.oficina)]||'':'';
}

async function sbGet(table,params=''){
  const r=await fetch(`${SB_URL}/rest/v1/${table}${params}`,{headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

function mostrarError(msg){
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error-msg').textContent=msg;
  document.getElementById('error-box').classList.remove('hidden');
}
function mostrarRevocado(){
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('revocado-box').classList.remove('hidden');
}
function urlDescarga(cloudinaryUrl){
  return cloudinaryUrl.replace('/upload/','/upload/fl_attachment/');
}

async function init(){
  const params=new URLSearchParams(location.search);
  const eventoId=params.get('evento');
  if(!eventoId){ mostrarError('Este enlace no incluye un evento válido.'); return; }

  try{
    const eventoRows=await sbGet('alumbrado_eventos',`?id=eq.${encodeURIComponent(eventoId)}`);
    evento=Array.isArray(eventoRows)?eventoRows[0]:null;
    if(!evento){ mostrarError('No se encontró el evento indicado en este enlace.'); return; }
    if(evento.evidencia_publica===false){ mostrarRevocado(); return; }

    const [personal,asisEvento,faltasTodas,fotos,encuestas]=await Promise.all([
      sbGet('alumbrado_personal','?status=eq.activo&select=id,nombre,apellido_paterno,apellido_materno,oficina,seccion,es_lider_seccion&order=nombre.asc'),
      sbGet('alumbrado_asistencia_eventos',`?evento_id=eq.${encodeURIComponent(eventoId)}&select=personal_id,estado,capturado_en_seccion`),
      sbGet('alumbrado_asistencia_eventos','?estado=eq.FALTA&select=personal_id'),
      sbGet('alumbrado_fotos_actividad_seccion',`?evento_id=eq.${encodeURIComponent(eventoId)}&order=creado_en.asc`),
      sbGet('alumbrado_encuestas_seccion',`?evento_id=eq.${encodeURIComponent(eventoId)}&select=seccion,total_encuestas`)
    ]);

    personalCache=Array.isArray(personal)?personal:[];
    seccionesCatalogo=[...new Set(personalCache.filter(p=>p.seccion).map(p=>p.seccion))].sort();
    personalCache
      .filter(p=>p.es_lider_seccion===true && p.seccion)
      .forEach(p=>{ if(!liderPorSeccion[p.seccion]) liderPorSeccion[p.seccion]=nombreCompleto(p); });
    (Array.isArray(asisEvento)?asisEvento:[]).forEach(a=>{
      asisMap[a.personal_id]=a.estado||null;
      const persona=personalCache.find(p=>p.id===a.personal_id);
      const seccionEfectiva=a.capturado_en_seccion||(persona&&persona.seccion);
      if(!seccionEfectiva) return;
      if(!estadoPorSeccion[seccionEfectiva]) estadoPorSeccion[seccionEfectiva]={};
      estadoPorSeccion[seccionEfectiva][a.personal_id]=a.estado||null;
    });
    (Array.isArray(faltasTodas)?faltasTodas:[]).forEach(a=>{ faltasAcumuladas[a.personal_id]=(faltasAcumuladas[a.personal_id]||0)+1; });
    (Array.isArray(fotos)?fotos:[]).forEach(f=>{
      if(!fotosPorSeccion[f.seccion]) fotosPorSeccion[f.seccion]=[];
      fotosPorSeccion[f.seccion].push(f);
    });
    (Array.isArray(encuestas)?encuestas:[]).forEach(e=>{
      encuestasPorSeccion[e.seccion]=(encuestasPorSeccion[e.seccion]||0)+(typeof e.total_encuestas==='number'?e.total_encuestas:0);
    });
  }catch(e){
    console.error(e);
    mostrarError('No se pudo cargar la evidencia de este evento. Intenta de nuevo más tarde.');
    return;
  }

  document.getElementById('loading').classList.add('hidden');
  document.getElementById('contenido').classList.remove('hidden');
  document.getElementById('d-evento').textContent=evento.nombre||'—';
  document.getElementById('d-fecha').textContent=evento.fecha||'—';

  renderStats();
  renderTop3();
  renderFaltaron();
  renderSecciones();
}

function renderStats(){
  const conteo={ASISTENCIA:0,FALTA:0,VACACIONES:0,INCAPACIDAD:0};
  personalCache.forEach(p=>{
    const v=asisMap[p.id];
    if(v&&conteo.hasOwnProperty(v)) conteo[v]++;
  });
  const encuestasTotales=Object.values(encuestasPorSeccion).reduce((s,n)=>s+n,0);
  document.getElementById('st-asistencia').textContent=conteo.ASISTENCIA;
  document.getElementById('st-falta').textContent=conteo.FALTA;
  document.getElementById('st-vacaciones').textContent=conteo.VACACIONES;
  document.getElementById('st-incapacidad').textContent=conteo.INCAPACIDAD;
  document.getElementById('st-total').textContent=personalCache.length;
  document.getElementById('st-encuestas').textContent=encuestasTotales;
}

function renderTop3(){
  const cont=document.getElementById('top3-cont');
  const medallas=['🥇','🥈','🥉'];
  const ranking=seccionesCatalogo
    .map(num=>({num, total:encuestasPorSeccion[num]||0}))
    .filter(s=>s.total>0)
    .sort((a,b)=>b.total-a.total)
    .slice(0,3);
  if(!ranking.length){
    cont.innerHTML='<div class="vacio">Aún no hay encuestas registradas para este evento.</div>';
    return;
  }
  cont.innerHTML=`<div class="top3-grid">${ranking.map((s,i)=>`
    <div class="top3-item">
      <div class="top3-medalla">${medallas[i]}</div>
      <div class="top3-info">
        <div class="top3-seccion">Sec. ${s.num}</div>
        <div class="top3-lider">${liderDe(s.num)}</div>
        <div class="top3-oficina">${oficinaDe(s.num)}</div>
      </div>
      <div class="top3-num">${s.total}</div>
    </div>`).join('')}</div>`;
}

function renderFaltaron(){
  const faltaron=personalCache.filter(p=>asisMap[p.id]==='FALTA');
  document.getElementById('faltaron-count').textContent=faltaron.length;
  const cont=document.getElementById('faltaron-cont');
  if(!faltaron.length){
    cont.innerHTML='<div class="vacio">Nadie faltó en este evento.</div>';
    return;
  }
  cont.innerHTML=`<div class="faltaron-lista">${faltaron.map(p=>{
    const acum=faltasAcumuladas[p.id]||0;
    return `<div class="faltaron-row">
      <span class="faltaron-nombre">${nombreCompleto(p)||''}</span>
      <span class="faltaron-acum">${acum} falta${acum===1?'':'s'} total${acum===1?'':'es'}</span>
    </div>`;
  }).join('')}</div>`;
}

function renderSecciones(){
  const cont=document.getElementById('secciones-cont');
  if(!seccionesCatalogo.length){
    cont.innerHTML='<div class="vacio">Sin secciones registradas todavía.</div>';
    return;
  }
  cont.innerHTML=seccionesCatalogo.map(num=>{
    const nativos=personalCache.filter(p=>p.seccion===num);
    const mapaSeccion=estadoPorSeccion[num]||{};
    const participaron=Object.values(mapaSeccion).filter(e=>e==='ASISTENCIA').length;
    const encuestas=encuestasPorSeccion[num]||0;
    const fotos=fotosPorSeccion[num]||[];
    const abierta=seccionesExpandidas.has(num);
    return `<div class="seccion-item ${abierta?'open':''}" id="seccion-item-${num}">
      <div class="seccion-hdr" onclick="toggleSeccion('${num}')">
        <div class="seccion-hdr-num">Sec. ${num}</div>
        <div class="seccion-hdr-lider">
          <div class="nombre">${liderDe(num)}</div>
          <div class="oficina">${oficinaDe(num)}</div>
        </div>
        <div class="seccion-hdr-metric"><div class="n">${participaron}</div><div class="l">Participaron</div></div>
        <div class="seccion-hdr-metric"><div class="n">${encuestas}</div><div class="l">Encuestas</div></div>
        <div class="seccion-hdr-metric"><div class="n">${fotos.length}</div><div class="l">Fotos</div></div>
        <div class="seccion-arrow">▼</div>
      </div>
      <div class="seccion-detail">${abierta?renderSeccionDetalle(num,nativos,mapaSeccion,fotos):''}</div>
    </div>`;
  }).join('');
}

function renderSeccionDetalle(num,nativos,mapaSeccion,fotos){
  const idsConFila=new Set(Object.keys(mapaSeccion));
  const filasNativos=nativos.map(p=>({
    nombre:nombreCompleto(p),
    estado:idsConFila.has(String(p.id))?mapaSeccion[p.id]:null,
    esExterno:false
  }));
  const idsNativos=new Set(nativos.map(p=>String(p.id)));
  const filasExternas=Object.keys(mapaSeccion)
    .filter(pid=>!idsNativos.has(pid))
    .map(pid=>{
      const persona=personalCache.find(p=>String(p.id)===pid);
      return {nombre:persona?nombreCompleto(persona):'(persona)',estado:mapaSeccion[pid],esExterno:true};
    });
  const filas=[...filasNativos,...filasExternas];

  const asisHtml=filas.length
    ? `<div class="asis-grid">${filas.map(f=>{
        const cls=f.estado?`e-${f.estado}`:'e-SIN';
        const label=f.estado?ESTADO_LABEL[f.estado]:'Sin capturar';
        const tag=f.esExterno?' <span style="color:var(--muted);font-size:10px">(otra sección)</span>':'';
        return `<div class="asis-row"><span>${f.nombre}${tag}</span><span class="asis-estado ${cls}">${label}</span></div>`;
      }).join('')}</div>`
    : '<div class="vacio">Sin personal activo registrado en esta sección.</div>';

  const fotosHtml=fotos.length
    ? `<div class="fotos-grid">${fotos.map((f,i)=>`
        <div class="foto-item">
          <img src="${f.cloudinary_url}" loading="lazy" alt="Evidencia sección ${num} ${i+1}">
          <a class="btn-descarga" href="${urlDescarga(f.cloudinary_url)}" download>⬇ Descargar</a>
        </div>`).join('')}</div>`
    : '<div class="vacio">Sin evidencia fotográfica todavía</div>';

  return `<div class="seccion-detail-title">👥 Asistencia</div>${asisHtml}
    <div class="seccion-detail-title" style="margin-top:16px">📸 Fotos (${fotos.length})</div>${fotosHtml}`;
}

function toggleSeccion(num){
  if(seccionesExpandidas.has(num)) seccionesExpandidas.delete(num);
  else seccionesExpandidas.add(num);
  renderSecciones();
}

init();
</script>
</body>
</html>
