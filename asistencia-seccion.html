<!DOCTYPE html>
<html lang="es">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pan:#003399;--pan2:#1a4fc4;--red:#cc0000;
  --bg:#f0f4ff;--white:#fff;--text:#1a1a2e;--muted:#6b7280;
  --border:#d1d9f0;--shadow:0 2px 12px rgba(0,51,153,.08);
  --radius:14px;--radius-sm:8px;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}
.hidden{display:none!important}
.topbar{background:var(--pan);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,102,.2)}
.topbar-logo{font-size:17px;font-weight:800;letter-spacing:.06em}
.exp-badges{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.exp-badge{display:block;width:100%;box-sizing:border-box;text-align:center;font-size:26px;font-weight:700;line-height:1.25;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:10px 12px}
.exp-countdown{font-size:32px;font-weight:800}
.exp-countdown.exp-warn{background:#fce8e8;border-color:#f5c2c2;color:var(--red)}
@media(max-width:380px){
  .exp-badge{font-size:20px}
  .exp-countdown{font-size:24px}
}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem;box-shadow:var(--shadow);margin-bottom:1rem}
.center-msg{text-align:center;padding:3rem 1.5rem;color:var(--muted);font-size:14px}
.center-msg .ico{font-size:40px;margin-bottom:10px}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.fg input,.fg select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;color:var(--text);outline:none;background:#fff}
.fg input:focus,.fg select:focus{border-color:var(--pan)}
.btn{padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;border:none;transition:.15s}
.btn-primary{background:var(--pan);color:#fff}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{background:#f0f4ff;color:var(--pan);border:1px solid var(--border)}
.btn-link{background:none;border:none;color:var(--pan);font-size:13px;font-weight:700;cursor:pointer;padding:4px 0;margin-bottom:8px}
.w-full{width:100%}
.error-msg{color:var(--red);font-size:12px;font-weight:700;margin-bottom:10px}
.seccion-hdr{margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.seccion-num{font-size:16px;font-weight:800;color:var(--pan)}
.seccion-lider{font-size:12px;color:var(--muted);margin-top:2px}
.seccion-evento{font-size:12px;color:var(--muted);margin-top:2px}
.persona-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.persona-row:last-child{border-bottom:none}
.persona-nombre{flex:1;font-size:13px;font-weight:600;min-width:110px}
.persona-actividad{max-width:150px;padding:6px 8px;border:1.5px solid var(--border);border-radius:7px;font-size:12px}
.persona-status{font-size:13px;width:16px;text-align:center;flex-shrink:0}
.persona-origen{font-size:10px;color:var(--pan);background:#e6eeff;border-radius:20px;padding:1px 7px;font-weight:700;flex-shrink:0}
.estado-select{width:132px;flex-shrink:0;padding:6px 8px;border:1.5px solid var(--border);border-radius:7px;font-size:12px;font-weight:700;background:#fff;color:var(--muted);cursor:pointer}
.estado-select:disabled{opacity:.5;cursor:not-allowed}
.estado-select.e-asistencia{background:#eaf3de;border-color:#a3d977;color:#2d6a4f}
.estado-select.e-falta{background:#fce8e8;border-color:#f5c2c2;color:#cc0000}
.estado-select.e-vacaciones{background:#e6eeff;border-color:#b3c6ff;color:#003399}
.estado-select.e-incapacidad{background:#fef3c7;border-color:#fac775;color:#854f0b}

.mapa-preview{display:flex;align-items:center;gap:10px;padding:8px;background:#f8faff;border:1px solid var(--border);border-radius:8px;margin-bottom:12px;cursor:pointer}
.mapa-preview-thumb{width:44px;height:44px;object-fit:cover;border-radius:6px;flex-shrink:0}
.mapa-preview-pdf{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px;background:#fff;border:1px solid var(--border);border-radius:6px;flex-shrink:0}

.visor-mapas{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:600;overflow-y:auto;padding:16px}
.visor-mapas-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:sticky;top:0}
.visor-mapas-hdr h3{color:#fff;font-size:15px}
.visor-mapas-hdr .close-btn{color:#fff;font-size:26px;background:none;border:none;cursor:pointer;line-height:1}
.visor-mapa-item{background:#fff;border-radius:10px;padding:12px;margin-bottom:14px}
.visor-mapa-item img{width:100%;border-radius:8px;display:block;margin-bottom:10px}
.visor-mapa-pdf{display:block;text-align:center;padding:40px 12px;background:var(--bg);border-radius:8px;margin-bottom:10px;font-size:40px}
.visor-mapa-pdf-link{display:block;text-align:center;margin-bottom:10px;text-decoration:none}
.visor-mapa-pdf-link img{width:100%;border-radius:8px;display:block;margin-bottom:6px;background:var(--bg)}
.visor-mapa-pdf-link span{font-size:13px}
.buscar-otra{position:relative;margin:10px 0}
.buscar-otra input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;outline:none}
.buscar-otra-resultados{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);margin-top:4px;max-height:220px;overflow-y:auto;z-index:20}
.buscar-otra-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--border)}
.buscar-otra-item:last-child{border-bottom:none}
.buscar-otra-item:hover{background:#f0f4ff}
.buscar-otra-item .bo-sec{font-size:11px;color:var(--muted)}
.buscar-otra-vacio{padding:9px 12px;font-size:12px;color:var(--muted)}
.aviso-apoyo{background:#fef3c7;border:2px solid #f5a623;border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:14px;font-weight:700;color:#854f0b;text-align:center;box-shadow:0 2px 8px rgba(245,166,35,.25)}

.ee-meta-faltan{color:#cc0000;font-weight:800}
.ee-total-row{font-size:13px;font-weight:700;margin-top:6px}
.ee-aclaracion-ee{background:#fef3c7;border:2px solid #f5a623;border-radius:10px;color:#000;font-weight:800;font-size:15px;text-align:center;padding:10px 12px;margin-bottom:10px}

.apoyos-lista{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}

.apoyo-tag{font-size:10px;font-weight:700;color:#854f0b;background:#fff;border:1px solid #fac775;border-radius:20px;padding:1px 7px}
.foto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-bottom:10px}
.foto-thumb{aspect-ratio:1;background:#f0f4ff;border:1px solid var(--border);border-radius:8px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px}
.foto-thumb img{width:100%;height:100%;object-fit:cover}
.foto-thumb.uploading{color:var(--muted)}
.foto-thumb.error{color:var(--red);background:#fce8e8}
.foto-check{position:absolute;bottom:2px;right:2px;background:#2d6a4f;color:#fff;font-size:11px;font-weight:800;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.foto-btns{display:flex;gap:8px}
.save-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:12px 16px;box-shadow:0 -2px 12px rgba(0,0,0,.08);z-index:50}
.save-bar-inner{max-width:640px;margin:0 auto}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--pan);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;box-shadow:0 4px 16px rgba(0,51,153,.3);max-width:calc(100vw - 32px);width:max-content;text-align:center}
#toast.show{opacity:1}
@media(max-width:420px){
  .persona-actividad{max-width:110px}
}
</style>

<body>

<div class="topbar">
  <div class="topbar-logo">🧹 GEMACUU</div>
  <div class="exp-badges">
    <div class="exp-badge" id="exp-badge">⏳ Enlace temporal</div>
    <div class="exp-badge exp-countdown hidden" id="exp-countdown"></div>
  </div>
</div>

<div class="wrap">

  <div id="loading" class="center-msg">
    <div class="ico">⏳</div>
    Cargando enlace…
  </div>

  <div id="error-box" class="card hidden">
    <div class="center-msg">
      <div class="ico">⚠️</div>
      <div id="error-msg" style="font-weight:700;color:var(--red)"></div>
    </div>
  </div>

  <div id="acceso-gate" class="card hidden">
    <div class="fg">
      <label>Contraseña (tu número de sección)</label>
      <input type="text" inputmode="numeric" id="inp-seccion-gate" placeholder="ej. 3244">
    </div>
    <div class="fg" id="fg-nombre-gate">
      <label>Tu nombre</label>
      <input type="text" id="inp-nombre-gate" placeholder="Ej. Octavio" oninput="mayusculizarInput(this)">
      <div style="font-size:11px;color:var(--muted);margin-top:4px">Escribe tu primer nombre en mayúscula</div>
    </div>
    <div id="acceso-error" class="error-msg hidden"></div>
    <button class="btn btn-primary w-full" id="btn-entrar-gate" onclick="confirmarAcceso()">Entrar →</button>
  </div>

  <div id="apoyo-selector" class="card hidden">
    <div class="aviso-apoyo" style="margin-bottom:14px">⚠️ Tu sección hoy va de apoyo — Selecciona a qué sección vas a apoyar</div>
    <div class="fg">
      <label>¿A qué sección vas a apoyar?</label>
      <select id="sel-apoyo-destino"></select>
    </div>
    <div id="apoyo-selector-error" class="error-msg hidden"></div>
    <button class="btn btn-primary w-full" id="btn-confirmar-apoyo" onclick="confirmarApoyoDestino()">Confirmar y continuar →</button>
  </div>

  <div id="sin-actividad" class="card hidden">
    <div class="center-msg">
      <div class="ico">🚫</div>
      Sin actividad asignada para este evento
    </div>
  </div>

  <div id="app" class="hidden">
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px" id="registrado-como"></div>
    <div id="aviso-apoyo" class="aviso-apoyo hidden"></div>
    <div id="seccion-cont"></div>
  </div>

</div>

<div id="save-bar" class="save-bar hidden">
  <div class="save-bar-inner">
    <button class="btn btn-primary w-full" id="btn-guardar-todo" onclick="guardarTodo()">💾 Guardar asistencia</button>
  </div>
</div>

<div id="toast"></div>

<div id="visor-mapas" class="visor-mapas hidden">
  <div class="visor-mapas-hdr">
    <h3 id="visor-mapas-titulo">📍 Mapas</h3>
    <button type="button" class="close-btn" onclick="cerrarVisorMapas()">✕</button>
  </div>
  <div id="visor-mapas-lista"></div>
</div>

async function sbGet(table,params=''){
  const r=await fetch(`${SB_URL}/rest/v1/${table}${params}`,{headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`}});
  return r.json();
}
async function sbPost(table,body){
  return fetch(`${SB_URL}/rest/v1/${table}`,{method:'POST',headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)});
}
async function sbPatch(table,params,body){
  return fetch(`${SB_URL}/rest/v1/${table}${params}`,{method:'PATCH',headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)});
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>t.classList.remove('show'),2500);
}

// Inserta fl_attachment justo después de /upload/ para que Cloudinary fuerce
// la descarga real del archivo en vez de solo abrir la imagen/PDF en el navegador.
function urlDescarga(cloudinaryUrl){
  return cloudinaryUrl.replace('/upload/','/upload/fl_attachment/');
}

// Los PDF se suben con /auto/upload, así que Cloudinary los guarda como
// resource_type "image" y puede rasterizar la página 1 como JPG sin volver
// a subir el archivo: pg_1 = página 1, f_jpg = formato de salida.
function urlPreviewPdf(cloudinaryUrl){
  return cloudinaryUrl.replace('/upload/','/upload/f_jpg,pg_1/');
}

function mayusculizarInput(input){
  const pos=input.selectionStart;
  input.value=input.value.toUpperCase();
  input.setSelectionRange(pos,pos);
}

function mostrarError(msg){
  document.getElementById('loading').classList.add('hidden');
  document.getElementById('error-msg').textContent=msg;
  document.getElementById('error-box').classList.remove('hidden');
}

// Reloj visual, no cambia cuándo el enlace deja de funcionar (eso lo decide expiraEn ya cargado).
function actualizarCuentaRegresiva(){
  if(!expiraEn) return;
  const el=document.getElementById('exp-countdown');
  const msRestantes=expiraEn.getTime()-Date.now();
  const totalMin=Math.max(0,Math.floor(msRestantes/60000));
  const horas=Math.floor(totalMin/60);
  const minutos=totalMin%60;
  el.textContent=`⏱ ${String(horas).padStart(2,'0')}h ${String(minutos).padStart(2,'0')}m restantes`;
  el.classList.toggle('exp-warn',totalMin<60);
  el.classList.remove('hidden');
}

async function init(){
  const params=new URLSearchParams(location.search);
  token=params.get('token');
  if(!token){ mostrarError('Este enlace no incluye un token válido.'); return; }

  let rows=await sbGet('enlaces_temporales',`?token=eq.${encodeURIComponent(token)}`);
  enlace=Array.isArray(rows)?rows[0]:null;
  if(!enlace || enlace.revocado){ mostrarError('Este enlace no es válido o fue revocado.'); return; }

  if(!enlace.primera_apertura){
    await fetch(`${SB_URL}/rest/v1/enlaces_temporales?token=eq.${encodeURIComponent(token)}&primera_apertura=is.null`,{
      method:'PATCH',
      headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({primera_apertura:new Date().toISOString()})
    });
    rows=await sbGet('enlaces_temporales',`?token=eq.${encodeURIComponent(token)}`);
    enlace=Array.isArray(rows)?rows[0]:null;
    if(!enlace){ mostrarError('Este enlace no es válido.'); return; }
  }

  expiraEn=new Date(new Date(enlace.primera_apertura).getTime()+(enlace.vigencia_horas||15)*60*60*1000);
  if(new Date()>expiraEn){
    mostrarError(`Este enlace caducó el ${expiraEn.toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}.`);
    return;
  }

  eventoId=enlace.evento_id;
  seccionesValidas=enlace.secciones||[];
  if(!eventoId||!seccionesValidas.length){ mostrarError('Este enlace no tiene una actividad o secciones configuradas.'); return; }

  const eventoRows=await sbGet('eventos',`?id=eq.${eventoId}`);
  eventoInfo=(Array.isArray(eventoRows)&&eventoRows[0])?eventoRows[0]:null;

  document.getElementById('exp-badge').textContent=`⏳ Enlace temporal — caduca ${expiraEn.toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}`;
  actualizarCuentaRegresiva();
  setInterval(actualizarCuentaRegresiva,60000);
  document.getElementById('loading').classList.add('hidden');

  registradoPor=(localStorage.getItem('gemacuu_asis_nombre')||'').toUpperCase();
  document.getElementById('fg-nombre-gate').classList.toggle('hidden',!!registradoPor);
  document.getElementById('acceso-gate').classList.remove('hidden');
  document.getElementById('inp-seccion-gate').focus();
}

async function confirmarAcceso(){
  const numSeccion=document.getElementById('inp-seccion-gate').value.trim();
  const nombreInput=document.getElementById('inp-nombre-gate').value.trim().toUpperCase();
  const errEl=document.getElementById('acceso-error');
  errEl.classList.add('hidden');

  if(!registradoPor && !nombreInput){
    errEl.textContent='Escribe tu nombre.';
    errEl.classList.remove('hidden');
    return;
  }
  if(!numSeccion){
    errEl.textContent='Escribe tu número de sección.';
    errEl.classList.remove('hidden');
    return;
  }

  // Validación en vivo contra "personal" (no la lista fija capturada al generar el enlace):
  // así una sección corregida después de generado el enlace se reconoce de inmediato.
  // Esta validación (contraseña = número de sección) no cambia.
  const btn=document.getElementById('btn-entrar-gate');
  btn.disabled=true;
  btn.textContent='Verificando…';
  let personas;
  try{
    personas=await sbGet('personal',`?seccion=eq.${encodeURIComponent(numSeccion)}&status=eq.activo&select=id&limit=1`);
  }catch(e){
    personas=null;
  }

  if(!Array.isArray(personas)||!personas.length){
    btn.disabled=false;
    btn.textContent='Entrar →';
    errEl.textContent='Número de sección no válido.';
    errEl.classList.remove('hidden');
    return;
  }

  if(!registradoPor){
    registradoPor=nombreInput;
    localStorage.setItem('gemacuu_asis_nombre',registradoPor);
  }

  // ¿La sección ingresada está activa este evento? (tiene fila en encuestas_seccion para este evento_id)
  // Nunca se recuerda una asignación de apoyo de una sesión anterior: si la sección no está
  // activa, siempre se le pregunta de nuevo a qué sección va a apoyar hoy (ver mostrarSelectorApoyo).
  seccionOrigenNum=numSeccion;
  seccionEsApoyo=false;
  seccionDestinoApoyo=null;
  let esActiva=false;
  let seccionesActivasEvento=[];
  try{
    const activaRows=await sbGet('encuestas_seccion',`?evento_id=eq.${eventoId}&seccion=eq.${encodeURIComponent(numSeccion)}&select=seccion&limit=1`);
    esActiva=Array.isArray(activaRows)&&activaRows.length>0;
    if(!esActiva){
      const todasActivas=await sbGet('encuestas_seccion',`?evento_id=eq.${eventoId}&select=seccion`);
      seccionesActivasEvento=[...new Set((Array.isArray(todasActivas)?todasActivas:[]).map(r=>r.seccion))];
    }
  }catch(e){
    btn.disabled=false;
    btn.textContent='Entrar →';
    errEl.textContent='No se pudo verificar la actividad de esta sección — intenta de nuevo.';
    errEl.classList.remove('hidden');
    return;
  }
  btn.disabled=false;
  btn.textContent='Entrar →';

  if(esActiva){
    document.getElementById('acceso-gate').classList.add('hidden');
    await entrarASeccion(numSeccion);
    return;
  }

  if(!seccionesActivasEvento.length){
    document.getElementById('acceso-gate').classList.add('hidden');
    document.getElementById('sin-actividad').classList.remove('hidden');
    return;
  }

  document.getElementById('acceso-gate').classList.add('hidden');
  mostrarSelectorApoyo(seccionesActivasEvento);
}

// Llena el <select> con las secciones activas de este evento y muestra la pantalla de
// selección — siempre desde cero, nunca precargada con una elección de una sesión anterior.
function mostrarSelectorApoyo(seccionesActivasEvento){
  const sel=document.getElementById('sel-apoyo-destino');
  const ordenadas=[...seccionesActivasEvento].sort((a,b)=>a.localeCompare(b,'es',{numeric:true}));
  sel.innerHTML='<option value="">— selecciona una sección —</option>'+
    ordenadas.map(num=>{
      const cat=SECCIONES.find(s=>s.num===num);
      return `<option value="${num}">${num}${cat?' — '+cat.encargado:''}</option>`;
    }).join('');
  document.getElementById('apoyo-selector-error').classList.add('hidden');
  document.getElementById('apoyo-selector').classList.remove('hidden');
}

// Guarda (upsert) la elección del líder en apoyos_seccion_evento y carga la tarjeta destino.
async function confirmarApoyoDestino(){
  const destino=document.getElementById('sel-apoyo-destino').value;
  const errEl=document.getElementById('apoyo-selector-error');
  errEl.classList.add('hidden');
  if(!destino){
    errEl.textContent='Selecciona a qué sección vas a apoyar.';
    errEl.classList.remove('hidden');
    return;
  }
  const btn=document.getElementById('btn-confirmar-apoyo');
  const textoOriginal=btn.textContent;
  btn.disabled=true;
  btn.textContent='Guardando…';
  try{
    const existentes=await sbGet('apoyos_seccion_evento',`?evento_id=eq.${eventoId}&seccion_origen=eq.${encodeURIComponent(seccionOrigenNum)}&select=id&limit=1`);
    let r;
    if(Array.isArray(existentes)&&existentes.length){
      r=await sbPatch('apoyos_seccion_evento',`?evento_id=eq.${eventoId}&seccion_origen=eq.${encodeURIComponent(seccionOrigenNum)}`,{seccion_destino:destino});
    } else {
      r=await sbPost('apoyos_seccion_evento',{evento_id:eventoId,seccion_origen:seccionOrigenNum,seccion_destino:destino});
    }
    if(!r.ok) throw new Error(await r.text());
  }catch(e){
    console.error('Error guardando apoyo',e);
    btn.disabled=false;
    btn.textContent=textoOriginal;
    errEl.textContent='No se pudo guardar tu selección — intenta de nuevo.';
    errEl.classList.remove('hidden');
    return;
  }
  seccionEsApoyo=true;
  seccionDestinoApoyo=destino;
  btn.disabled=false;
  btn.textContent=textoOriginal;
  document.getElementById('apoyo-selector').classList.add('hidden');
  // La tarjeta que se carga es SIEMPRE la de la propia sección del líder (su gente, su
  // asistencia) — el aviso amarillo arriba le recuerda a qué sección va de apoyo. Lo único
  // que cuenta hacia esa sección destino es el EE que capture (ver cargarYRenderizar).
  await entrarASeccion(seccionOrigenNum);
}

// Carga al líder en vivo de la sección a mostrar (propia o destino de apoyo) y renderiza su tarjeta.
async function entrarASeccion(numSeccionCard){
  const liderRows=await sbGet('personal',`?seccion=eq.${encodeURIComponent(numSeccionCard)}&es_lider_seccion=eq.true&status=eq.activo&select=nombre&order=nombre.asc&limit=1`);
  const catalogo=SECCIONES.find(s=>s.num===numSeccionCard)||{num:numSeccionCard,padrino:''};
  const liderNombre=(Array.isArray(liderRows)&&liderRows[0]?.nombre)||'— sin líder activo —';
  seccionActual={...catalogo,num:numSeccionCard,encargado:liderNombre};
  await cargarYRenderizar();
}

async function cargarYRenderizar(){
  document.getElementById('registrado-como').textContent=`Registrando como: ${registradoPor}`;
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('save-bar').classList.remove('hidden');

  const avisoEl=document.getElementById('aviso-apoyo');
  if(seccionEsApoyo){
    avisoEl.textContent=`⚠️ Tu sección (${seccionOrigenNum}) va de apoyo a la sección ${seccionDestinoApoyo}`;
    avisoEl.classList.remove('hidden');
  } else {
    avisoEl.classList.add('hidden');
  }

  const num=seccionActual.num;

  const personal=await sbGet('personal',`?status=eq.activo&seccion=eq.${encodeURIComponent(num)}&order=nombre.asc`);
  personalSeccion=Array.isArray(personal)?personal:[];
  const idsPropios=new Set(personalSeccion.map(p=>p.id));

  if(personalSeccion.length){
    const ids=personalSeccion.map(p=>p.id).join(',');
    const asis=await sbGet('asistencia_eventos',`?evento_id=eq.${eventoId}&personal_id=in.(${ids})`);
    (Array.isArray(asis)?asis:[]).forEach(a=>{
      asistenciaPersonas[a.personal_id]={estado:a.estado||null,actividad:a.actividad||null};
    });
  }

  // Gente de OTRAS secciones que este líder ya marcó antes desde este mismo enlace de sección:
  // se reconoce por capturado_en_seccion, no por su sección real, para que sobreviva a un recargo de página.
  const asisExterna=await sbGet('asistencia_eventos',`?evento_id=eq.${eventoId}&capturado_en_seccion=eq.${encodeURIComponent(num)}&select=personal_id,estado,actividad`);
  const idsExternos=(Array.isArray(asisExterna)?asisExterna:[])
    .map(a=>a.personal_id)
    .filter(id=>!idsPropios.has(id));
  if(idsExternos.length){
    const personalExternoRows=await sbGet('personal',`?id=in.(${idsExternos.join(',')})&order=nombre.asc`);
    personalExterno=Array.isArray(personalExternoRows)?personalExternoRows:[];
    asisExterna.forEach(a=>{
      if(idsPropios.has(a.personal_id)) return;
      asistenciaPersonas[a.personal_id]={estado:a.estado||null,actividad:a.actividad||null};
    });
  } else {
    personalExterno=[];
  }

  const apoyos=await sbGet('apoyos_no_registrados',`?evento_id=eq.${eventoId}&seccion=eq.${encodeURIComponent(num)}&order=creado_en.asc`);
  apoyosSeccion=Array.isArray(apoyos)?apoyos:[];

  // "Total de encuestas de la app", su bloqueo y la meta EE son datos de la sección OFICIAL
  // que este líder está viendo/apoyando — nunca de su propia sección (num), que en modo apoyo
  // ni siquiera tiene fila en encuestas_seccion (por eso salió el selector de apoyo: su sección
  // no está activa este evento). Antes se leían con num y el candado/total/meta de un líder en
  // apoyo salían siempre vacíos, sin importar el valor real de la sección oficial que apoyaba.
  seccionEEDestino=seccionEsApoyo?seccionDestinoApoyo:num;
  const encuestas=await sbGet('encuestas_seccion',`?evento_id=eq.${eventoId}&seccion=eq.${encodeURIComponent(seccionEEDestino)}`);
  if(!Array.isArray(encuestas)){
    // sbGet no valida el status HTTP: si esta consulta falla (permisos, red), devuelve un
    // objeto de error en vez de un arreglo y antes eso se interpretaba en silencio como
    // "sin bloqueo" — se deja registrado para poder diagnosticarlo desde la consola.
    console.error('No se pudo leer encuestas_seccion para bloquear_total_encuestas/meta_ee',seccionEEDestino,encuestas);
  }
  const encRow=(Array.isArray(encuestas)&&encuestas[0])?encuestas[0]:null;
  totalEncuestas=encRow?encRow.total_encuestas:null;
  bloquearTotalEncuestas=!!(encRow&&encRow.bloquear_total_encuestas);
  metaEE=encRow?encRow.meta_ee:null;

  const eeCapturas=await sbGet('ee_capturas_seccion',`?evento_id=eq.${eventoId}&seccion_destino=eq.${encodeURIComponent(seccionEEDestino)}&select=cantidad_ee,lider_nombre`);
  const filasEE=Array.isArray(eeCapturas)?eeCapturas:[];
  eeCapturasSuma=filasEE.reduce((s,r)=>s+(typeof r.cantidad_ee==='number'?r.cantidad_ee:0),0);
  // Mi propia fila (identificada por mi nombre) — el campo debe mostrar MI número ya
  // guardado para poder corregirlo, no partir en blanco como si nunca hubiera capturado.
  const miFilaEE=filasEE.find(r=>r.lider_nombre===registradoPor);
  miEEPropioActual=miFilaEE?miFilaEE.cantidad_ee:null;

  const fotos=await sbGet('fotos_actividad_seccion',`?evento_id=eq.${eventoId}&seccion=eq.${encodeURIComponent(num)}&order=creado_en.asc`);
  fotosSeccion=Array.isArray(fotos)?fotos:[];

  // Mapas de la sección: no dependen del evento, son del lugar físico.
  const mapas=await sbGet('mapas_seccion',`?seccion=eq.${encodeURIComponent(num)}&order=subido_en.asc`);
  mapasSeccion=Array.isArray(mapas)?mapas:[];

  renderSeccion();
}

function eventosNombreActual(){
  if(!eventoInfo) return 'Actividad seleccionada';
  return `${eventoInfo.nombre||''}${eventoInfo.fecha?' · '+eventoInfo.fecha:''}`;
}

// Total de EE (SUM de todas las capturas de esta sección+evento) contra la meta_ee del evento.
function renderEETotalHtml(){
  if(metaEE===null||metaEE===undefined){
    return `Total EE capturado: <b>${eeCapturasSuma}</b>`;
  }
  const faltan=metaEE-eeCapturasSuma;
  if(faltan>0){
    return `Total EE: <b>${eeCapturasSuma}</b> / Meta ${metaEE} — <span class="ee-meta-faltan">Faltan ${faltan}</span>`;
  }
  return `Total EE: <b>${eeCapturasSuma}</b> / Meta ${metaEE} — <span class="ee-meta-cumplida">✅ META CUMPLIDA</span>`;
}

// Cada líder (dueño o de apoyo) mete SU propio total — el campo parte mostrando lo que
// esa persona ya había capturado antes (ver cargarYRenderizar/miEEPropioActual), y "Guardar"
// ACTUALIZA su propia fila en ee_capturas_seccion (o la crea, si es su primera captura aquí)
// en vez de sumarle una fila nueva. Nunca toca la fila de otra persona — cada quien solo
// puede corregir lo que ELLA MISMA capturó, sea dueña de la sección o esté dando apoyo.
// Requiere la restricción única (evento_id, seccion_destino, lider_nombre) en la tabla.
async function guardarEEPropio(){
  const inp=document.getElementById('input-ee-propio');
  const raw=inp.value.trim();
  if(raw===''){ showToast('⚠️ Escribe cuántas EE hiciste'); return; }
  const n=Number(raw);
  if(!Number.isFinite(n)||!Number.isInteger(n)||n<0){ showToast('⚠️ Debe ser un número entero válido'); return; }
  const btn=document.getElementById('btn-guardar-ee');
  btn.disabled=true;
  btn.textContent='Guardando…';
  const payload={evento_id:eventoId,seccion_destino:seccionEEDestino,lider_nombre:registradoPor,cantidad_ee:n};
  const {ok}=await postConReintentos(`${SB_URL}/rest/v1/ee_capturas_seccion?on_conflict=evento_id,seccion_destino,lider_nombre`,[payload]);
  btn.disabled=false;
  btn.textContent='Guardar';
  if(!ok){ showToast('⚠️ No se pudo guardar tus EE — intenta de nuevo'); return; }
  // El total de la sección resta mi valor anterior (si tenía) y suma el nuevo — ya no es
  // un acumulador ciego, sino la suma real de las filas tal como quedan tras el upsert.
  eeCapturasSuma=eeCapturasSuma-(miEEPropioActual??0)+n;
  miEEPropioActual=n;
  const totalRow=document.getElementById('ee-total-row');
  if(totalRow) totalRow.innerHTML=renderEETotalHtml();
  showToast(`✓ Tus EE quedaron en ${n}`);
}

function marcarEstadoFila(personalId,estado){
  const el=document.getElementById(`status-${personalId}`);
  if(!el) return;
  if(estado==='guardando'){ el.textContent='⏳'; el.style.cursor='default'; el.title='Guardando…'; }
  else if(estado==='ok'){
    el.textContent='✓'; el.style.cursor='default'; el.title='Guardado';
    setTimeout(()=>{ if(el.textContent==='✓') el.textContent=''; },1200);
  } else if(estado==='error'){
    el.textContent='⚠️'; el.style.cursor='pointer'; el.title='Error al guardar — clic para reintentar';
  } else { el.textContent=''; el.style.cursor='default'; el.title=''; }
}

function cambiarEstado(personalId,valor,sel){
  const actual=asistenciaPersonas[personalId]||{estado:null,actividad:null};
  const esAsistencia=valor==='ASISTENCIA';
  const nuevaActividad=esAsistencia?(actual.actividad||ACTIVIDADES[0]):null;
  asistenciaPersonas[personalId]={estado:valor,actividad:nuevaActividad};

  sel.className=`estado-select ${ESTADO_CLASS[valor]||''}`;
  sel.querySelector('option[value=""]').disabled=true;
  const actividadSel=sel.parentElement.querySelector('.persona-actividad');
  actividadSel.classList.toggle('hidden',!esAsistencia);
  if(esAsistencia) actividadSel.value=nuevaActividad;

  autoguardarPersona(personalId,{estado:valor,actividad:nuevaActividad});
}

function reintentarPersona(personalId){
  if(pendientesAutosave.has(personalId)) return; // ya hay un intento en curso
  const estado=asistenciaPersonas[personalId];
  if(!estado||!estado.estado) return;
  autoguardarPersona(personalId,estado);
}

function cambiarActividad(personalId,valor){
  const actual=asistenciaPersonas[personalId]||{estado:'ASISTENCIA',actividad:null};
  actual.actividad=valor;
  asistenciaPersonas[personalId]=actual;
  autoguardarPersona(personalId,{estado:actual.estado,actividad:valor});
}

async function autoguardarPersona(personalId,estado,intentos=0){
  marcarEstadoFila(personalId,'guardando');
  const eventoIdCtx=eventoId; // contexto inmutable de esta operación
  const seccionCtx=seccionActual.num;
  const usuarioCtx=registradoPor;
  const promesa=(async()=>{
    try{
      const r=await fetch(`${SB_URL}/rest/v1/asistencia_eventos?on_conflict=evento_id,personal_id`,{
        method:'POST',
        headers:{
          'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,
          'Content-Type':'application/json',
          'Prefer':'resolution=merge-duplicates,return=minimal'
        },
        body:JSON.stringify([{
          evento_id:eventoIdCtx,
          personal_id:personalId,
          estado:estado.estado,
          actividad:estado.actividad,
          capturado_en_seccion:seccionCtx,
          registrado_por:usuarioCtx,
          updated_at:new Date().toISOString()
        }])
      });
      if(!r.ok) throw new Error(await r.text());
      marcarEstadoFila(personalId,'ok');
    }catch(e){
      if(intentos<2){
        await new Promise(res=>setTimeout(res,800*(intentos+1)));
        pendientesAutosave.delete(personalId);
        return autoguardarPersona(personalId,estado,intentos+1);
      }
      console.error('Error autoguardando asistencia',personalId,e);
      marcarEstadoFila(personalId,'error');
    }finally{
      pendientesAutosave.delete(personalId);
    }
  })();
  pendientesAutosave.set(personalId,promesa);
  return promesa;
}

function buscarOtraPersona(q){
  clearTimeout(buscarOtraTimer);
  const resEl=document.getElementById('buscar-otra-resultados');
  q=q.trim();
  if(q.length<2){ resEl.classList.add('hidden'); resEl.innerHTML=''; return; }
  buscarOtraTimer=setTimeout(async()=>{
    // Se piden más de los que se muestran porque el orden alfabético de la
    // base no prioriza "empieza con" — eso se resuelve abajo, en el cliente.
    const rows=await sbGet('personal',`?status=eq.activo&nombre=ilike.*${encodeURIComponent(q)}*&order=nombre.asc&limit=50`);
    const yaListados=new Set([...personalSeccion,...personalExterno].map(p=>p.id));
    const qUpper=q.toUpperCase();
    buscarOtraResultados=(Array.isArray(rows)?rows:[])
      .filter(p=>!yaListados.has(p.id))
      .sort((a,b)=>{
        const aEmpieza=(a.nombre||'').toUpperCase().startsWith(qUpper);
        const bEmpieza=(b.nombre||'').toUpperCase().startsWith(qUpper);
        if(aEmpieza!==bEmpieza) return aEmpieza?-1:1;
        return (a.nombre||'').localeCompare(b.nombre||'','es');
      })
      .slice(0,15);
    if(!buscarOtraResultados.length){
      resEl.innerHTML='<div class="buscar-otra-vacio">Sin resultados (o ya está en la lista).</div>';
    } else {
      resEl.innerHTML=buscarOtraResultados.map(p=>`
        <div class="buscar-otra-item" onclick="agregarPersonaExterna('${p.id}')">
          ${p.nombre}<div class="bo-sec">${p.seccion?'Sec. '+p.seccion:'sin sección'}</div>
        </div>`).join('');
    }
    resEl.classList.remove('hidden');
  },300);
}

function agregarPersonaExterna(personalId){
  const p=buscarOtraResultados.find(x=>x.id===personalId);
  if(!p) return;
  personalExterno.push(p);
  asistenciaPersonas[p.id]=asistenciaPersonas[p.id]||{estado:null,actividad:null};
  document.getElementById('inp-buscar-otra').value='';
  document.getElementById('buscar-otra-resultados').classList.add('hidden');
  renderSeccion();
  showToast(`✓ ${p.nombre} agregada — captura su estado abajo`);
}

function mostrarFormApoyo(){ document.getElementById('apoyo-form').classList.remove('hidden'); }
function ocultarFormApoyo(){
  document.getElementById('apoyo-form').classList.add('hidden');
  document.getElementById('apoyo-nombre').value='';
}

async function guardarApoyo(){
  const nombre=document.getElementById('apoyo-nombre').value.trim();
  const actividad=document.getElementById('apoyo-actividad').value;
  if(!nombre){ showToast('Escribe el nombre de quien apoyó'); return; }
  const payload={seccion:seccionActual.num,fecha:hoy,evento_id:eventoId,nombre,actividad,es_no_registrado:true,enlace_token:token,registrado_por:registradoPor};
  const r=await sbPost('apoyos_no_registrados',payload);
  if(!r.ok){ showToast('⚠️ No se pudo guardar el apoyo — intenta de nuevo'); return; }
  apoyosSeccion.push(payload);
  document.getElementById('apoyos-lista').innerHTML=apoyosSeccion.map(renderApoyoChip).join('');
  ocultarFormApoyo();
  showToast(`✓ ${nombre} agregado como apoyo`);
}

function renderApoyoChip(a){
  return `<div class="apoyo-chip">🏷️ ${a.nombre} · ${a.actividad} <span class="apoyo-tag">apoyo no registrado</span></div>`;
}

async function handleFotos(input){
  const files=Array.from(input.files||[]);
  if(!files.length) return;
  const grid=document.getElementById('fotos-grid');
  for(const file of files){
    const thumb=document.createElement('div');
    thumb.className='foto-thumb uploading';
    thumb.textContent='⏳';
    grid.appendChild(thumb);
    try{
      const fd=new FormData();
      fd.append('file',file);
      fd.append('upload_preset',PRESET);
      fd.append('folder',`gemacuu/asistencia-seccion/${seccionActual.num}/${hoy}`);
      const r=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD}/image/upload`,{method:'POST',body:fd});
      const d=await r.json();
      if(d.secure_url){
        const rInsert=await sbPost('fotos_actividad_seccion',{seccion:seccionActual.num,fecha:hoy,evento_id:eventoId,cloudinary_url:d.secure_url,cloudinary_public_id:d.public_id,enlace_token:token,registrado_por:registradoPor});
        thumb.className='foto-thumb';
        thumb.textContent='';
        const img=document.createElement('img');
        img.src=d.secure_url;
        thumb.appendChild(img);
        if(rInsert.ok){
          const check=document.createElement('span');
          check.className='foto-check';
          check.textContent='✓';
          thumb.appendChild(check);
          setTimeout(()=>{ if(thumb.contains(check)) check.remove(); },1500);
        }
      } else {
        thumb.className='foto-thumb error';
        thumb.textContent='⚠️';
      }
    }catch(e){
      thumb.className='foto-thumb error';
      thumb.textContent='⚠️';
      console.error(e);
    }
  }
  input.value='';
}

// POST con reintentos (2 intentos extra con espera creciente) — misma lógica que
// ya protege el autoguardado por persona, para que un parpadeo de señal no cuente
// como error definitivo en el guardado de respaldo.
async function postConReintentos(url,body,intentos=0){
  try{
    const r=await fetch(url,{
      method:'POST',
      headers:{'apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(body)
    });
    if(!r.ok){ console.error('Error guardando',url,await r.text()); return {ok:false}; }
    return {ok:true};
  }catch(e){
    if(intentos<2){
      await new Promise(res=>setTimeout(res,800*(intentos+1)));
      return postConReintentos(url,body,intentos+1);
    }
    console.error('Error de red guardando',url,e);
    return {ok:false};
  }
}

async function guardarTodo(){
  const btn=document.getElementById('btn-guardar-todo');
  const textoOriginal=btn.textContent;
  btn.disabled=true;
  btn.textContent='Guardando...';

  // Si el admin bloqueó el total de encuestas para este evento, el campo está deshabilitado
  // en la tarjeta y nunca se manda a guardar (para no arriesgar sobreescribir nada mientras está bloqueado).
  const raw=bloquearTotalEncuestas?'':document.getElementById('input-encuestas').value.trim();
  let encuestasPayload=null;
  if(raw!==''){
    const n=Number(raw);
    if(!Number.isFinite(n)||!Number.isInteger(n)||n<0){
      showToast('⚠️ "Total de encuestas" debe ser un número entero válido');
      btn.disabled=false;btn.textContent=textoOriginal;
      return;
    }
    // seccionEEDestino, no seccionActual.num: en modo apoyo, seccionActual.num es la sección
    // propia del líder (no oficial/activa este evento, sin fila en encuestas_seccion) — guardar
    // ahí creaba una fila fantasma en vez de actualizar la sección oficial que en realidad apoya.
    encuestasPayload={seccion:seccionEEDestino,fecha:hoy,evento_id:eventoId,total_encuestas:n,enlace_token:token,registrado_por:registradoPor,updated_at:new Date().toISOString()};
  }

  // Respaldo idempotente: espera autoguardados en curso y vuelve a mandar un snapshot completo
  await Promise.allSettled(Array.from(pendientesAutosave.values()));

  const snapshotEventoId=eventoId;
  const snapshotSeccion=seccionActual.num;
  // Respaldo: solo gente con un estado realmente capturado — nunca se inventa "Falta" para quien no se ha revisado.
  const registros=[...personalSeccion,...personalExterno]
    .filter(p=>asistenciaPersonas[p.id]?.estado)
    .map(p=>{
      const estado=asistenciaPersonas[p.id];
      return {
        evento_id:snapshotEventoId,
        personal_id:p.id,
        estado:estado.estado,
        actividad:estado.estado==='ASISTENCIA'?(estado.actividad||ACTIVIDADES[0]):null,
        capturado_en_seccion:snapshotSeccion,
        registrado_por:registradoPor,
        updated_at:new Date().toISOString()
      };
    });

  let personasConError=0;
  for(let i=0;i<registros.length;i+=50){
    const lote=registros.slice(i,i+50);
    const {ok}=await postConReintentos(`${SB_URL}/rest/v1/asistencia_eventos?on_conflict=evento_id,personal_id`,lote);
    if(!ok) personasConError+=lote.length;
  }

  let encuestasConError=false;
  if(encuestasPayload){
    const {ok}=await postConReintentos(`${SB_URL}/rest/v1/encuestas_seccion?on_conflict=seccion,evento_id`,[encuestasPayload]);
    if(!ok) encuestasConError=true;
  }

  btn.disabled=false;btn.textContent=textoOriginal;
  if(personasConError>0&&encuestasConError){
    showToast(`⚠️ No se guardó la asistencia de ${personasConError} persona(s) ni el total de encuestas — vuelve a intentar`);
  } else if(personasConError>0){
    showToast(`⚠️ No se pudo guardar la asistencia de ${personasConError} persona(s) — vuelve a intentar`);
  } else if(encuestasConError){
    showToast('⚠️ No se pudo guardar el total de encuestas — vuelve a intentar');
  } else {
    showToast('✅ Asistencia guardada correctamente');
  }
}
