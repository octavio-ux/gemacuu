<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Registro de Evento</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#fff;color:#1a1a2e;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.container{width:100%;max-width:400px}
h1{font-size:1.3rem;font-weight:700;margin-bottom:24px;text-align:center;color:#1a1a2e}
.form-group{margin-bottom:20px}
label{display:block;font-size:0.85rem;font-weight:600;margin-bottom:6px;color:#333}
input[type="text"],input[type="tel"]{width:100%;padding:14px;border:2px solid #ddd;border-radius:8px;font-size:1rem;transition:border-color 0.2s}
input:focus{outline:none;border-color:#238636}
.file-upload{width:100%;padding:20px;border:2px dashed #ccc;border-radius:8px;text-align:center;cursor:pointer;transition:border-color 0.2s}
.file-upload:hover{border-color:#238636}
.file-upload.has-files{border-color:#238636;background:#f0fff4}
.btn{width:100%;padding:16px;background:#238636;color:#fff;border:none;border-radius:8px;font-size:1.1rem;font-weight:600;cursor:pointer;transition:opacity 0.2s}
.btn:hover{opacity:0.9}
.btn:disabled{background:#999;cursor:not-allowed}
.status{text-align:center;padding:12px;border-radius:8px;margin-bottom:16px;font-weight:600;font-size:0.9rem}
.status.error{background:#fff0f0;color:#d32f2f;border:1px solid #ffcdd2}
.status.success{background:#f0fff4;color:#238636;border:1px solid #c8e6c9}
.status.info{background:#e3f2fd;color:#1565c0;border:1px solid #bbdefb}
.hidden{display:none}
.success-screen{text-align:center;padding:40px 20px}
.success-screen h2{font-size:2rem;color:#238636;margin-bottom:12px}
.success-screen p{font-size:1.2rem;color:#666}
.checkmark{font-size:4rem;margin-bottom:16px}
.file-count{font-size:0.8rem;color:#666;margin-top:4px}
</style>
</head>
<body>
<div class="container">
  <div id="geo-status" class="status info">📍 Verificando ubicaci\u00f3n...</div>
  
  <div id="form-container" class="hidden">
    <h1>Registro de Asistencia</h1>
    <form id="registro-form">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" placeholder="Tu nombre completo" required>
      </div>
      <div class="form-group">
        <label for="celular">N\u00famero Celular</label>
        <input type="tel" id="celular" placeholder="614 123 4567" required>
      </div>
      <div class="form-group">
        <label for="fotos">Subir Fotos</label>
        <div class="file-upload" id="file-upload-area" onclick="document.getElementById('fotos').click()">
          \ud83d\udcf7 Toca para seleccionar fotos
        </div>
        <div class="file-count hidden" id="file-count"></div>
        <input type="file" id="fotos" accept="image/*" multiple capture="environment" style="display:none">
      </div>
      <button type="submit" class="btn" id="submit-btn">Enviar Registro</button>
    </form>
  </div>

  <div id="fuera-rango" class="hidden">
    <div class="status error" style="font-size:1.2rem;padding:24px">📍 Fuera de rango</div>
    <p style="text-align:center;color:#666;margin-top:12px">Debes estar cerca del Centro de Convenciones para registrarte.</p>
  </div>

  <div id="success-screen" class="hidden">
    <div class="success-screen">
      <div class="checkmark">\u2705</div>
      <h2>Gracias</h2>
      <p>Guardado</p>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL='https://hhqauklluvlfqbweipxa.supabase.co';
const SUPABASE_KEY='sb_publishable_2p9bArBsYLD3GG_seT6E7w_C7DSdwsP';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const GEO_CENTER = { lat: 28.6353, lng: -106.0889 };
const GEO_RADIUS = 450;

const params = new URLSearchParams(window.location.search);
const actividad = params.get('actividad') || 'evento30mayo';

const CLOUD_NAME = 'dxhylvkgj';
const UPLOAD_PRESET = 'gemacuu_unsigned';

function haversineDistance(lat1, lng1, lat2, lng2) {
  const R = 6371e3;
  const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
  const dp = (lat2-lat1) * Math.PI/180;
  const dl = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function checkGeofence() {
  const statusEl = document.getElementById('geo-status');
  if (!navigator.geolocation) {
    statusEl.textContent = '\u26a0\ufe0f Tu navegador no soporta geolocalizaci\u00f3n';
    statusEl.className = 'status error';
    return;
  }
  if (params.get('demo') === 'true') {
    statusEl.className = 'hidden';
    document.getElementById('form-container').classList.remove('hidden');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const dist = haversineDistance(pos.coords.latitude, pos.coords.longitude, GEO_CENTER.lat, GEO_CENTER.lng);
      if (dist <= GEO_RADIUS) {
        statusEl.className = 'hidden';
        document.getElementById('form-container').classList.remove('hidden');
      } else {
        statusEl.className = 'hidden';
        document.getElementById('fuera-rango').classList.remove('hidden');
      }
    },
    (err) => {
      statusEl.textContent = '\u26a0\ufe0f Permite el acceso a tu ubicaci\u00f3n para continuar';
      statusEl.className = 'status error';
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

document.getElementById('fotos').addEventListener('change', function(e) {
  const count = e.target.files.length;
  const area = document.getElementById('file-upload-area');
  if (count > 0) {
    area.classList.add('has-files');
    area.textContent = '\ud83d\udcf7 ' + count + ' foto' + (count>1?'s':'') + ' seleccionada' + (count>1?'s':'');
  }
});

async function uploadToCloudinary(file, folder) {
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', UPLOAD_PRESET);
  formData.append('folder', folder);
  const res = await fetch('https://api.cloudinary.com/v1_1/' + CLOUD_NAME + '/image/upload', {
    method: 'POST', body: formData
  });
  const data = await res.json();
  return data.secure_url;
}

function normalizeStr(s) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
function tokenMatch(input, target) {
  const inputTokens = normalizeStr(input).split(/\s+/).sort();
  const targetTokens = normalizeStr(target).split(/\s+/).sort();
  let matches = 0;
  for (const t of inputTokens) {
    if (targetTokens.some(tt => tt.includes(t) || t.includes(tt))) matches++;
  }
  return matches / Math.max(inputTokens.length, targetTokens.length);
}

async function findPadrino(nombre) {
  const { data } = await supabase.from('personnel_list').select('nombre_completo, padrino');
  if (!data || data.length === 0) return 'Sin padrino asignado';
  let bestMatch = null, bestScore = 0;
  for (const p of data) {
    const score = tokenMatch(nombre, p.nombre_completo);
    if (score > bestScore) { bestScore = score; bestMatch = p; }
  }
  return bestScore >= 0.6 ? bestMatch.padrino : 'Sin padrino asignado';
}

document.getElementById('registro-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Guardando...';
  try {
    const nombre = document.getElementById('nombre').value.trim();
    const celular = document.getElementById('celular').value.trim();
    const files = document.getElementById('fotos').files;
    const folder = 'gemacuu/' + actividad + '/' + nombre.replace(/\s+/g,'_');
    const photoUrls = [];
    for (const file of files) {
      try { const url = await uploadToCloudinary(file, folder); photoUrls.push(url); } catch(err) { console.error(err); }
    }
    const padrino = await findPadrino(nombre);
    const { error } = await supabase.from('event_registrations').insert({
      activity_name: actividad,
      nombre_completo: nombre,
      celular: celular,
      padrino: padrino,
      photo_urls: photoUrls,
      created_at: new Date().toISOString()
    });
    if (error) throw error;
    document.getElementById('form-container').classList.add('hidden');
    document.getElementById('success-screen').classList.remove('hidden');
  } catch(err) {
    alert('Error al guardar: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Enviar Registro';
  }
});

checkGeofence();
</script>
</body>
</html>
